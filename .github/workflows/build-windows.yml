
name: VANTA X - Windows VST3 Build

on:
  workflow_dispatch:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    name: Build VANTA X VST3
    runs-on: windows-2022
    timeout-minutes: 45

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Verify Visual Studio
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path $vswhere)) {
            throw "Visual Studio Installer not found"
          }
          $vs = & $vswhere -latest -products * -property installationPath
          if (!$vs) {
            throw "Visual Studio 2022 installation not found"
          }
          Write-Host "Visual Studio found: $vs"

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Configure VANTA X
        shell: pwsh
        run: |
          if (Test-Path build) {
            Remove-Item build -Recurse -Force
          }

          New-Item -ItemType Directory -Force logs | Out-Null

          cmake -S . -B build `
            -G "Visual Studio 17 2022" `
            -A x64 `
            2>&1 | Tee-Object -FilePath logs/configure.log

          if ($LASTEXITCODE -ne 0) {
            throw "CMake configure failed"
          }

      - name: Build VANTA X VST3
        shell: pwsh
        run: |
          cmake --build build `
            --config Release `
            --parallel 2 `
            2>&1 | Tee-Object -FilePath logs/build.log

          if ($LASTEXITCODE -ne 0) {
            throw "VANTA X compilation failed"
          }

      - name: Locate VST3
        id: vst3
        shell: pwsh
        run: |
          $plugin = Get-ChildItem -Path build -Filter "*.vst3" -Directory -Recurse |
            Select-Object -First 1

          if (!$plugin) {
            throw "No VST3 bundle found. Check the CMake target and build configuration."
          }

          Write-Host "VST3 found: $($plugin.FullName)"
          "VST3_PATH=$($plugin.FullName)" >> $env:GITHUB_ENV

      - name: Package VANTA X
        shell: pwsh
        run: |
          Compress-Archive `
            -Path "$env:VST3_PATH" `
            -DestinationPath "VANTA-X-VST3-Windows-x64.zip" `
            -Force

      - name: Upload VANTA X VST3
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-X-VST3-Windows-x64
          path: VANTA-X-VST3-Windows-x64.zip
          if-no-files-found: error

      - name: Upload Build Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: VANTA-X-Build-Logs
          path: logs/
          if-no-files-found: ignore
